name: Release

# Tag vX.Y.Z -> build the sdist and wheel, check them, publish to PyPI with Trusted Publishing
# (OpenID Connect; no API token is stored in the repository).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build sdist and wheel
        run: uv build
      - name: The tag must match the package version
        run: |
          version="$(ls dist/capwx-*.whl | sed -E 's#.*/capwx-([^-]+)-py3.*#\1#')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Check the artifacts contain everything a release ships
        run: uv run --no-project python scripts/check_dist.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/capwx
    permissions:
      id-token: write  # Trusted Publishing: the job exchanges an OIDC token for a PyPI upload token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
