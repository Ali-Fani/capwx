name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff and pyright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Sync dependencies
        run: uv sync --group dev --extra django --extra ninja --extra drf --extra bolt
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: pyright (strict, src/capwx)
        run: uv run pyright

  unit:
    name: unit (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Sync dependencies
        run: uv sync --group dev --extra django --extra ninja --extra drf --extra bolt --python ${{ matrix.python }}
      - name: "Unit tests with coverage (fails under 90% on src/capwx)"
        run: |
          uv run --python ${{ matrix.python }} coverage run -m pytest
          uv run coverage report

  unit-no-wasmtime:
    # Platforms without a wasmtime wheel: capwx must import and run sha256-pow without it.
    name: unit without wasmtime (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Sync dependencies
        run: uv sync --group dev --extra django
      - name: Uninstall wasmtime
        run: uv pip uninstall wasmtime
      # --no-sync: a plain `uv run` would reinstall wasmtime from the lock file first.
      - name: Sha256-only tests
        run: uv run --no-sync pytest -q tests/test_no_wasmtime.py tests/test_sha256_pow.py tests/test_crypto.py tests/test_tokens.py

  redis:
    name: unit with Redis (ubuntu)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Sync dependencies
        run: uv sync --group dev --extra django --extra ninja --extra drf --extra bolt --extra redis
      - name: Redis store tests (not skipped here)
        run: uv run pytest tests/test_stores.py -v

  e2e:
    name: browser e2e (chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Sync dependencies
        run: uv sync --group dev --group e2e --extra django --extra ninja --extra drf --extra bolt
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser e2e tests (real cap-widget)
        run: uv run pytest -m e2e tests/e2e -v

  node:
    name: node interop (node 22)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Sync dependencies
        run: uv sync --group dev --extra django --extra ninja --extra drf --extra bolt
      - name: Node interop tests (capjs-core installed in a temp dir by the test)
        run: uv run pytest -m node tests/test_interop_node.py -v
