[package]
name = "capwx-hashwx-native"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "capwx_hashwx"
crate-type = ["cdylib"]

[build-dependencies]
cc = "1"

[profile.release]
# Small artefact: the library is data, like the wasm it would replace.
lto = true
codegen-units = 1
strip = true
